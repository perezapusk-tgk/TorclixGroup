services:
  - type: web
    name: torclixgroup-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: pnpm install --prod=false && pnpm --filter @torclix/api build
    preDeployCommand: pnpm --filter @torclix/api migrate
    startCommand: pnpm --filter @torclix/api start
    healthCheckPath: /health
    envVars:
      - key: SKIP_INSTALL_DEPS
        value: "true"
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.14.0
      - key: TORCLIX_DEV_AUTH
        value: "false"
      - key: TORCLIX_TRIAL_MODE
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: torclixgroup-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: CORS_ORIGIN
        value: https://torclixgroup-web.onrender.com
      - key: PUBLIC_URL
        value: https://torclixgroup-api.onrender.com
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: AUTH_ISSUER
        sync: false
      - key: AUTH_AUDIENCE
        sync: false
      - key: AUTH_JWKS_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PRICE_STARTER
        sync: false
      - key: STRIPE_PRICE_PRO
        sync: false
      - key: STRIPE_PRICE_SCALE
        sync: false
      - key: STRIPE_PRICE_STARTER_USD
        sync: false
      - key: STRIPE_PRICE_PRO_USD
        sync: false
      - key: STRIPE_PRICE_SCALE_USD
        sync: false
      - key: STRIPE_PRICE_STARTER_RUB
        sync: false
      - key: STRIPE_PRICE_PRO_RUB
        sync: false
      - key: STRIPE_PRICE_SCALE_RUB
        sync: false

  - type: web
    name: torclixgroup-web
    runtime: static
    buildCommand: pnpm install --prod=false && pnpm --filter @torclix/web build
    staticPublishPath: apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: VITE_API_URL
        value: https://torclixgroup-api.onrender.com
      - key: VITE_TORCLIX_DEMO
        value: "false"
      - key: VITE_TORCLIX_TRIAL
        value: "true"
      - key: VITE_AUTH0_DOMAIN
        value: dev-5p5papfgff5e8qgh.us.auth0.com
      - key: VITE_AUTH0_CLIENT_ID
        value: ZUvvjMqVYH9x8GrkScKXajcJah7KKnB9
      - key: VITE_AUTH0_AUDIENCE
        value: https://torclixgroup-api

databases:
  - name: torclixgroup-db
    plan: free
    region: frankfurt
    databaseName: torclixgroup
    postgresMajorVersion: "17"
