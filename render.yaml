services:
  - type: web
    name: torclixgroup-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: pnpm install --prod=false && pnpm --filter @torclix/api build
    preDeployCommand: pnpm --filter @torclix/api migrate
    startCommand: pnpm --filter @torclix/api start
    healthCheckPath: /health
    envVars:
      - key: SKIP_INSTALL_DEPS
        value: "true"
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.14.0
      - key: TORCLIX_DEV_AUTH
        value: "false"
      - key: TORCLIX_TRIAL_MODE
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: torclixgroup-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: CORS_ORIGIN
        value: https://torclixgroup-web.onrender.com
      - key: PUBLIC_URL
        value: https://torclixgroup-api.onrender.com
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: AUTH_ISSUER
        sync: false
      - key: AUTH_AUDIENCE
        sync: false
      - key: AUTH_JWKS_URL
        sync: false

  - type: web
    name: torclixgroup-web
    runtime: static
    buildCommand: pnpm install --prod=false && pnpm --filter @torclix/web build
    staticPublishPath: apps/web/dist
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: VITE_API_URL
        value: https://torclixgroup-api.onrender.com
      - key: VITE_TORCLIX_DEMO
        value: "false"
      - key: VITE_TORCLIX_TRIAL
        value: "true"

databases:
  - name: torclixgroup-db
    plan: free
    region: frankfurt
    databaseName: torclixgroup
    postgresMajorVersion: "17"
